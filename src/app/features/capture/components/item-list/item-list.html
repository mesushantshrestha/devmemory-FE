<div class="list">
  <div class="list-title">Saved Items</div>

  <div class="empty" *ngIf="items.length === 0">Nothing saved yet.</div>

  <div class="row" *ngFor="let item of items" [routerLink]="['/item', item.id]">
    <div class="meta">
      <span class="type">{{ item.type }}</span>
      <span class="date">{{ item.createdAt | date : 'short' }}</span>
      <span class="task-state-icon" *ngIf="item.type === 'task'" [class.done]="!!item.done" [class.pending]="!item.done" [attr.title]="item.done ? 'Done' : 'Pending'" [attr.aria-label]="item.done ? 'Done' : 'Pending'">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" *ngIf="item.done; else pendingTaskIcon">
          <path d="m5 13 4 4L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <ng-template #pendingTaskIcon>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2"/>
          </svg>
        </ng-template>
      </span>
    </div>

    <div class="lang" *ngIf="item.type === 'snippet'">
      {{ item.language }}
    </div>

    <div class="item-title" *ngIf="item.title">
      {{ item.title }}
    </div>

    <div class="text" *ngIf="item.type !== 'snippet'">
      {{ item.text }}
    </div>

    <pre class="code" *ngIf="item.type === 'snippet'">{{ item.text }}</pre>


    <div class="row-actions">
      <button
        class="icon-btn copy-btn"
        [class.copied]="copiedId === item.id"
        type="button"
        *ngIf="item.type === 'snippet'"
        (click)="$event.preventDefault(); $event.stopPropagation(); copySnippet(item.text, item.id)"
        [attr.aria-label]="copiedId === item.id ? 'Copied' : 'Copy snippet'"
        [attr.title]="copiedId === item.id ? 'Copied' : 'Copy snippet'"
      >
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" *ngIf="copiedId !== item.id; else copiedIcon">
          <rect x="9" y="9" width="10" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/>
          <path d="M7 15H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <ng-template #copiedIcon>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m5 13 4 4L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </ng-template>
        <span>{{ copiedId === item.id ? 'Copied' : 'Copy' }}</span>
      </button>

      <button
        *ngIf="confirmId !== item.id"
        class="icon-btn icon-btn-danger"
        type="button"
        (click)="$event.preventDefault(); $event.stopPropagation(); requestDelete(item.id)"
        aria-label="Delete item"
        title="Delete item"
      >
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 7h16M9 7V5h6v2m-8 0 1 12h8l1-12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <!-- Confirmation UI -->
    <div class="confirm" *ngIf="confirmId === item.id">
      <span>Are you sure?</span>
      <button class="icon-btn icon-btn-confirm" type="button" (click)="$event.preventDefault(); $event.stopPropagation(); confirmDelete()" aria-label="Confirm delete" title="Confirm delete">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="m5 13 4 4L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="icon-btn" type="button" (click)="$event.preventDefault(); $event.stopPropagation(); cancelDelete()" aria-label="Cancel delete" title="Cancel delete">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6 6 18 18M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>
</div>
