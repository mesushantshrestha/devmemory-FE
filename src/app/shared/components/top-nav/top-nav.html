<nav class="nav">
  <div class="nav-links">
    <a routerLink="/capture" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Capture</a>
    <a routerLink="/saved" routerLinkActive="active">Saved</a>
  </div>

  @if (isAuthenticated()) {
    <div class="nav-actions">
      <div class="avatar" aria-hidden="true">
        @if (user()?.pictureUrl) {
          <img [src]="user()?.pictureUrl ?? ''" alt="" />
        } @else {
          <span>{{ initials() }}</span>
        }
      </div>
      <button type="button" class="logout" (click)="onLogout()">Logout</button>
    </div>
  }
</nav>
